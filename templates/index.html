<script>

    // ============================================================
    // DOM ELEMENTS
    // ============================================================

    const equityEl = document.getElementById("equity");
    const logicEl = document.getElementById("logic");
    const confidenceEl = document.getElementById("confidence");
    const confidenceBar = document.getElementById("confidenceBar");

    const executionFeed = document.getElementById("executionFeed");
    const emptyFeed = document.getElementById("emptyFeed");

    const engineButton = document.getElementById("engineButton");
    const engineStatus = document.getElementById("engineStatus");
    const statusDot = document.getElementById("statusDot");

    const intervalSelect = document.getElementById("intervalSelect");
    const connectionStatus = document.getElementById("connectionStatus");


    // ============================================================
    // LOCAL STATE
    // ============================================================

    let knownTrades = new Set();

    let networkNodes = [];

    let canvas;
    let ctx;

    let animationFrame;


    // ============================================================
    // ASSET COLORS
    // ============================================================

    const assetColors = {
        EURUSDm: "#75E063",
        GBPUSDm: "#60A5FA",
        BTCUSDm: "#F59E0B",
        XAUUSDm: "#FBBF24",
        USDJPYm: "#F472B6",
        AUDUSDm: "#A78BFA",
        USDCADm: "#34D399",
        NZDUSDm: "#FB7185"
    };


    function getAssetColor(asset) {

        if (assetColors[asset]) {
            return assetColors[asset];
        }

        // Generate a deterministic color for unknown assets
        let hash = 0;

        for (let i = 0; i < asset.length; i++) {
            hash = asset.charCodeAt(i) + ((hash << 5) - hash);
        }

        const hue = Math.abs(hash) % 360;

        return `hsl(${hue}, 70%, 65%)`;
    }


    // ============================================================
    // CANVAS INITIALIZATION
    // ============================================================

    function initializeCanvas() {

        canvas = document.getElementById("networkCanvas");
        ctx = canvas.getContext("2d");

        resizeCanvas();

        window.addEventListener(
            "resize",
            resizeCanvas
        );

        animateNetwork();
    }


    function resizeCanvas() {

        const dpr = window.devicePixelRatio || 1;

        canvas.width = window.innerWidth * dpr;
        canvas.height = window.innerHeight * dpr;

        canvas.style.width = `${window.innerWidth}px`;
        canvas.style.height = `${window.innerHeight}px`;

        ctx.setTransform(
            dpr,
            0,
            0,
            dpr,
            0,
            0
        );
    }


    // ============================================================
    // SPAWN TRADE NODE
    // ============================================================

    function spawnTradeCircle(trade) {

        // Keep nodes mostly away from the right-side dashboard
        const panelWidth = 430;

        const maxX = Math.max(
            250,
            window.innerWidth - panelWidth
        );

        const node = {

            x: 80 + Math.random() * Math.max(100, maxX - 160),

            y: 130 + Math.random() * Math.max(
                100,
                window.innerHeight - 220
            ),

            radius: 4 + Math.random() * 3,

            targetRadius: 4 + Math.random() * 3,

            color: getAssetColor(trade.asset),

            asset: trade.asset,

            signal: trade.signal,

            createdAt: performance.now(),

            life: 0,

            pulse: Math.random() * Math.PI * 2

        };

        networkNodes.push(node);

        // Prevent unlimited canvas growth
        if (networkNodes.length > 100) {
            networkNodes.shift();
        }
    }


    // ============================================================
    // CANVAS NETWORK ANIMATION
    // ============================================================

    function animateNetwork() {

        const width = window.innerWidth;
        const height = window.innerHeight;

        ctx.clearRect(
            0,
            0,
            width,
            height
        );


        // Very subtle radial background
        const gradient = ctx.createRadialGradient(
            width * 0.35,
            height * 0.45,
            0,
            width * 0.35,
            height * 0.45,
            Math.max(width, height) * 0.7
        );

        gradient.addColorStop(
            0,
            "rgba(117, 224, 99, 0.025)"
        );

        gradient.addColorStop(
            1,
            "rgba(11, 18, 14, 0)"
        );

        ctx.fillStyle = gradient;

        ctx.fillRect(
            0,
            0,
            width,
            height
        );


        // --------------------------------------------------------
        // Connecting neural-network lines
        // --------------------------------------------------------

        for (let i = 0; i < networkNodes.length; i++) {

            const a = networkNodes[i];

            for (let j = i + 1; j < networkNodes.length; j++) {

                const b = networkNodes[j];

                const dx = a.x - b.x;
                const dy = a.y - b.y;

                const distance = Math.sqrt(
                    dx * dx + dy * dy
                );

                const maxDistance = 280;

                if (distance < maxDistance) {

                    const opacity =
                        (1 - distance / maxDistance) * 0.16;

                    ctx.beginPath();

                    ctx.moveTo(
                        a.x,
                        a.y
                    );

                    ctx.lineTo(
                        b.x,
                        b.y
                    );

                    ctx.strokeStyle =
                        `rgba(117, 224, 99, ${opacity})`;

                    ctx.lineWidth = 0.7;

                    ctx.stroke();
                }
            }
        }


        // --------------------------------------------------------
        // Nodes
        // --------------------------------------------------------

        networkNodes.forEach(node => {

            node.life += 0.016;
            node.pulse += 0.045;

            const pulse =
                Math.sin(node.pulse) * 1.5;

            const radius =
                node.radius + pulse;


            // Glow
            const glow = ctx.createRadialGradient(
                node.x,
                node.y,
                0,
                node.x,
                node.y,
                radius * 7
            );

            glow.addColorStop(
                0,
                node.color
            );

            glow.addColorStop(
                0.2,
                node.color.replace(")", ", 0.35)")
            );

            glow.addColorStop(
                1,
                "rgba(0,0,0,0)"
            );

            ctx.beginPath();

            ctx.arc(
                node.x,
                node.y,
                radius * 7,
                0,
                Math.PI * 2
            );

            ctx.fillStyle = glow;

            ctx.fill();


            // Core
            ctx.beginPath();

            ctx.arc(
                node.x,
                node.y,
                Math.max(1.5, radius),
                0,
                Math.PI * 2
            );

            ctx.fillStyle = node.color;

            ctx.shadowColor = node.color;
            ctx.shadowBlur = 15;

            ctx.fill();

            ctx.shadowBlur = 0;


            // Small asset label
            ctx.font = "9px monospace";

            ctx.fillStyle = "rgba(229,231,235,0.38)";

            ctx.fillText(
                node.asset,
                node.x + 10,
                node.y - 8
            );

        });


        animationFrame = requestAnimationFrame(
            animateNetwork
        );
    }


    // ============================================================
    // ADD TRADE TO EXECUTION FEED
    // ============================================================

    function addTradeToFeed(trade) {

        if (emptyFeed) {
            emptyFeed.remove();
        }

        const entry = document.createElement("div");

        entry.className =
            "trade-entry mb-3 rounded-2xl border border-white/5 bg-white/[0.02] p-4";

        const color =
            getAssetColor(trade.asset);

        const signalClass =
            trade.signal === "BUY"
                ? "text-lime"
                : "text-red-400";

        const time =
            new Date(trade.time).toLocaleTimeString(
                [],
                {
                    hour: "2-digit",
                    minute: "2-digit",
                    second: "2-digit"
                }
            );


        entry.innerHTML = `

            <div class="flex items-center justify-between">

                <div class="flex items-center gap-2">

                    <div
                        class="h-2 w-2 rounded-full"
                        style="
                            background:${color};
                            box-shadow:0 0 10px ${color};
                        "
                    ></div>

                    <span class="text-xs font-semibold text-zinc-200">
                        ${escapeHtml(trade.asset)}
                    </span>

                </div>

                <span class="text-[9px] text-zinc-600">
                    ${time}
                </span>

            </div>


            <div class="mt-2 flex items-center justify-between">

                <span class="text-[10px] uppercase tracking-[0.18em] ${signalClass}">
                    ${escapeHtml(trade.signal)}
                </span>

                <span class="text-[9px] uppercase tracking-widest text-zinc-600">
                    EXECUTED
                </span>

            </div>


            <div class="mt-2 text-[10px] leading-4 text-zinc-500">
                ${escapeHtml(trade.logic)}
            </div>

        `;

        executionFeed.prepend(entry);

        // Spawn visual neural-network node
        spawnTradeCircle(trade);
    }


    // ============================================================
    // HTML ESCAPING
    // ============================================================

    function escapeHtml(value) {

        const div = document.createElement("div");

        div.textContent = value ?? "";

        return div.innerHTML;
    }


    // ============================================================
    // POLL BACKEND
    // ============================================================

    async function pollBackend() {

        try {

            const response = await fetch(
                "/api/status",
                {
                    cache: "no-store"
                }
            );

            if (!response.ok) {
                throw new Error(
                    `HTTP ${response.status}`
                );
            }

            const state = await response.json();


            // ----------------------------------------------------
            // Connection
            // ----------------------------------------------------

            connectionStatus.textContent = "Connected";

            connectionStatus.className =
                "rounded-full border border-lime/20 bg-lime/5 px-2.5 py-1 text-[9px] uppercase tracking-[0.15em] text-lime";


            // ----------------------------------------------------
            // Equity
            // ----------------------------------------------------

            const equity =
                Number(state.equity || 0);

            equityEl.textContent =
                `$${equity.toLocaleString(
                    "en-US",
                    {
                        minimumFractionDigits: 2,
                        maximumFractionDigits: 2
                    }
                )}`;


            // ----------------------------------------------------
            // AI Logic
            // ----------------------------------------------------

            logicEl.textContent =
                state.last_logic ||
                "Waiting for market intelligence...";


            // ----------------------------------------------------
            // Confidence
            // ----------------------------------------------------

            const confidence =
                Number(state.last_confidence || 0);

            confidenceEl.textContent =
                `${confidence}%`;

            confidenceBar.style.width =
                `${Math.min(100, Math.max(0, confidence))}%`;


            // ----------------------------------------------------
            // Engine status
            // ----------------------------------------------------

            updateEngineUI(
                Boolean(state.is_running)
            );


            // ----------------------------------------------------
            // Process new trades
            // ----------------------------------------------------

            const trades =
                Array.isArray(state.trade_history)
                    ? state.trade_history
                    : [];


            trades.forEach((trade, index) => {

                /*
                 * The backend currently doesn't assign a unique ID,
                 * so we construct one from the trade properties.
                 */

                const tradeId =
                    `${trade.time}_${trade.asset}_${trade.signal}_${index}`;

                if (!knownTrades.has(tradeId)) {

                    knownTrades.add(tradeId);

                    addTradeToFeed(trade);
                }

            });

        } catch (error) {

            console.error(
                "Backend polling error:",
                error
            );

            connectionStatus.textContent =
                "Disconnected";

            connectionStatus.className =
                "rounded-full border border-red-500/20 bg-red-500/5 px-2.5 py-1 text-[9px] uppercase tracking-[0.15em] text-red-400";
        }
    }


    // ============================================================
    // ENGINE CONTROL
    // ============================================================

    async function toggleEngine() {

        const currentlyRunning =
            statusDot.classList.contains("running");

        const action =
            currentlyRunning
                ? "stop"
                : "start";

        try {

            const response = await fetch(
                "/api/control",
                {
                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        action: action
                    })
                }
            );

            if (!response.ok) {
                throw new Error(
                    `HTTP ${response.status}`
                );
            }

            const state =
                await response.json();

            updateEngineUI(
                Boolean(state.bot_state.is_running)
            );

        } catch (error) {

            console.error(
                "Engine control error:",
                error
            );

            alert(
                "Could not communicate with the trading engine."
            );
        }
    }


    // ============================================================
    // UPDATE ENGINE UI
    // ============================================================

    function updateEngineUI(running) {

        if (running) {

            statusDot.classList.add("running");

            engineStatus.textContent =
                "Running";

            engineStatus.className =
                "text-[10px] font-medium uppercase tracking-[0.2em] text-lime";

            engineButton.textContent =
                "Stop Engine";

            engineButton.className =
                "rounded-xl border border-red-500/20 bg-red-500/5 px-4 py-2 text-xs font-semibold uppercase tracking-[0.12em] text-red-400 transition hover:bg-red-500/10";

        } else {

            statusDot.classList.remove("running");

            engineStatus.textContent =
                "Offline";

            engineStatus.className =
                "text-[10px] font-medium uppercase tracking-[0.2em] text-zinc-500";

            engineButton.textContent =
                "Initialize Engine";

            engineButton.className =
                "rounded-xl border border-lime/20 bg-lime/10 px-4 py-2 text-xs font-semibold uppercase tracking-[0.12em] text-lime transition hover:bg-lime/15 hover:shadow-[0_0_20px_rgba(117,224,99,0.15)]";
        }
    }


    // ============================================================
    // INTERVAL CONTROL
    // ============================================================

    intervalSelect.addEventListener(
        "change",
        async function () {

            const interval =
                Number(this.value);

            try {

                await fetch(
                    "/api/control",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify({
                            interval: interval
                        })
                    }
                );

            } catch (error) {

                console.error(
                    "Interval update failed:",
                    error
                );
            }
        }
    );


    // ============================================================
    // START APPLICATION
    // ============================================================

    initializeCanvas();

    // Poll immediately
    pollBackend();

    // Poll every 3 seconds
    setInterval(
        pollBackend,
        3000
    );

</script>
